services:
  - type: web
    name: taskflow-daniel
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "3000"
      # Se pide en el panel de Render; no se escribe aqui (repo publico).
      - key: JWT_SECRET
        sync: false
      - key: DB_PATH
        value: "/data/taskflow.db"
    disk:
      name: taskflow-data
      mountPath: /data
      sizeGB: 1
